[package]
name = "floral-notepaper"
version = "2.1.1"
description = "A lightweight cross-platform desktop note app"
authors = ["Achilng"]
edition = "2021"
default-run = "floral-notepaper"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "floral_notepaper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
# 注意：npm 侧的 `@tauri-apps/api` 必须与这里的 minor 对齐，否则 tauri-cli 会直接拒绝构建
# （"Found version mismatched Tauri packages"）。两边要一起动。
tauri = { version = "~2.12", features = ["protocol-asset", "tray-icon", "macos-private-api"] }
tauri-plugin-cli = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
tauri-plugin-clipboard-manager = "2"
# 把工作区里的文件**拖出窗口**到资源管理器。Tauri 自己没有这个 API（`start_dragging`
# 移动的是窗口），这个插件封装了 Windows 的 DoDragDrop / macOS 的 NSDragging。
tauri-plugin-drag = "2"
# 应用自更新。用官方插件，端点指向**自己的**发布地址（见 `selfupdate.rs`）——
# 原来是自研的那套，指向上游仓库，走完会把上游代码装进来，所以被停用了。
tauri-plugin-updater = "~2.14"
# 装完之后重启应用。updater 只负责下载与安装，重启要单独来。
tauri-plugin-process = "~2.4"
tokio = { version = "1", features = ["time"] }
trash = "5"
keyring = { version = "3", features = ["apple-native", "windows-native", "linux-native"] }
semver = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
# 插件市场：验签（清单用与应用自更新同一套 minisign 密钥）。
# 两个都已经是 updater 插件的传递依赖（就在 Cargo.lock 里），加直接依赖不新增编译产物。
# ⚠️ base64 必须是 0.22：0.21 只被 macOS 的 swift-rs 用着，Windows 上那份源码根本不会
# 下载，钉 0.21 会让构建在这台机器上取不到包。
minisign-verify = "0.3"
base64 = "0.22"
# 解压插件 zip。zip 4 已经是 tauri-plugin-updater 在 Windows 上的传递依赖（就在 Cargo.lock 里）。
# ⚠️ 只开 deflate 后端：默认特性会拉进 zstd / xz / bzip2 / aes 一整套压缩器，而我们只读
# 自己发出去的 deflate zip。flate2 与 miniz_oxide 也都在本地缓存里。
zip = { version = "4", default-features = false, features = ["deflate-flate2"] }
dirs = "6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
# 「复制文件」要写 Windows 的 CF_HDROP（文件列表）。clipboard-manager 插件没有这个能力，
# 而 clipboard-win 5.4.1 已经是 arboard 的传递依赖（就在 Cargo.lock 里），加直接依赖
# 不会新增编译产物。见 `src/clipboard.rs`。
clipboard-win = { version = "5", features = ["std"] }
# 「导出 PDF」直接写文件，走 WebView2 自己的 `PrintToPdf`（见 `src/pdf.rs`）。
# 版本必须与 tauri 2.12 拖进来的那份**完全一致**（Cargo.lock 里是 0.39.1 / windows 0.62.2）：
# `with_webview` 交出来的 `ICoreWebView2Controller` 就是这一版的类型，对不上编译器立刻会喊。
# `windows` 这里不是可选的 —— `webview2-com` 的完成回调宏展开成 `::windows::core::Result`，
# 那个路径得在**我们这个 crate** 里解析得到。
webview2-com = "0.39"
windows = "0.62"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_Console",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
raw-window-handle = "0.6"
