<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>office-viewer ops harness</title>
    <style>
      html, body { margin: 0; background: #f4f5f7; }
      #result { display: none; }
      #error { color: #b00; font: 13px/1.5 monospace; padding: 12px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <pre id="error"></pre>
    <pre id="result"></pre>
    <script type="module">
      // 由 run_ops.py 打开：ops-harness.html?fixture=O01&ops=ops/O01.json
      // 与 edit-harness 的区别：transcript 从 ops/*.json 读，不依赖 manifest 的 E 类。
      import { replayEdit } from "./out/edit-engine.js";

      const encode = (text) => {
        const bytes = new TextEncoder().encode(text);
        let binary = "";
        for (let i = 0; i < bytes.length; i += 1) binary += String.fromCharCode(bytes[i]);
        return btoa(binary);
      };

      const showError = (error) => {
        document.getElementById("error").textContent =
          `HARNESS-ERROR\n${error?.stack || error?.message || String(error)}`;
      };

      window.addEventListener("error", (event) => showError(event.error ?? event.message));
      window.addEventListener("unhandledrejection", (event) => showError(event.reason));

      (async () => {
        try {
          const params = new URLSearchParams(location.search);
          const fixture = params.get("fixture");
          const opsPath = params.get("ops");
          if (!fixture || !opsPath) throw new Error("missing ?fixture=O01&ops=ops/O01.json");
          const ops = await (await fetch(opsPath, { cache: "no-store" })).json();
          const result = await replayEdit(`fixtures/${fixture}.docx`, ops);
          result.id = fixture;
          result.ops = ops.length;
          document.getElementById("result").textContent = encode(JSON.stringify(result));
          document.title = `OK ${fixture}`;
        } catch (error) {
          showError(error);
          document.title = "ERROR";
        }
      })();
    </script>
  </body>
</html>
