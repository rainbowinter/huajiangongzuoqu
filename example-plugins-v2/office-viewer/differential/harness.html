<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>office-viewer layout harness</title>
    <style>
      html, body { margin: 0; background: #f4f5f7; }
      #result { display: none; }
      #error { color: #b00; font: 13px/1.5 monospace; padding: 12px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <pre id="error"></pre>
    <pre id="result"></pre>
    <script type="module">
      // 由 run_layout.py 通过 http://127.0.0.1:<port>/harness.html?f=C01 打开。
      // 结果以 base64(JSON) 放进 #result，避免 --dump-dom 的 HTML 转义污染。
      import { runLayout } from "./out/layout-engine.js";

      const encode = (text) => {
        const bytes = new TextEncoder().encode(text);
        let binary = "";
        for (let i = 0; i < bytes.length; i += 1) binary += String.fromCharCode(bytes[i]);
        return btoa(binary);
      };

      const showError = (error) => {
        document.getElementById("error").textContent =
          `HARNESS-ERROR\n${error?.stack || error?.message || String(error)}`;
      };

      window.addEventListener("error", (event) => showError(event.error ?? event.message));
      window.addEventListener("unhandledrejection", (event) => showError(event.reason));

      (async () => {
        try {
          const params = new URLSearchParams(location.search);
          const file = params.get("f");
          if (!file) throw new Error("missing ?f=<docx>");
          const response = await fetch(`fixtures/${file}.docx`, { cache: "no-store" });
          if (!response.ok) throw new Error(`fetch fixtures/${file}.docx -> ${response.status}`);
          const bytes = new Uint8Array(await response.arrayBuffer());
          const fingerprint = await runLayout(bytes);
          fingerprint.fixture = file;
          document.getElementById("result").textContent = encode(JSON.stringify(fingerprint));
          document.title = `OK ${file} ${fingerprint.stats.lineCount}L/${fingerprint.stats.pageCount}P`;
        } catch (error) {
          showError(error);
          document.title = "ERROR";
        }
      })();
    </script>
  </body>
</html>
